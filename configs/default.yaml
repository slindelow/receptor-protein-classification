# Sofia VS MVP — locked config (sofia-vs-v1-2026-10)
seed: 42
freeze_id: sofia-vs-v1-2026-10

fingerprint:
  radius: 2
  n_bits: 2048
  # Morgan/ECFP radius and bit length

binder:
  pkd_threshold: 7.0  # binder if pKd >= 7 (Kd <= 100 nM)

splits:
  scaffold_test_frac: 0.2
  cold_protein_test_frac: 0.2
  val_frac: 0.1

model:
  name: HistGradientBoostingRegressor
  max_iter: 200
  learning_rate: 0.08
  max_depth: 8
  min_samples_leaf: 20
  l2_regularization: 0.1
  early_stopping: true
  validation_fraction: 0.1
  n_iter_no_change: 15
  random_state: 42

protein_features:
  # type: aac | dpc | aac_dpc | esm2  (aac = 20-dim composition; MVP default)
  type: aac

eval:
  ef_fractions: [0.01, 0.05]
  metric_float_tol: 1.0e-4  # reproduce.sh absolute tolerance on Spearman/AUROC/EF

paths:
  raw_dir: data/raw
  splits_dir: data/splits
  models_dir: artifacts/models
  metrics_md: artifacts/metrics.md
  metrics_json: artifacts/metrics.json
  demo_library: data/demo/library.csv
  sample_ranked: artifacts/sample_ranked.csv
