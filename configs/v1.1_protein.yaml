# Sofia VS v1.1 protein ablation — sofia-vs-v1.1-protein
# Same raw DAVIS freeze + split CSVs as sofia-vs-v1-2026-10; do not regenerate splits.
seed: 42
freeze_id: sofia-vs-v1.1-protein
data_freeze_id: sofia-vs-v1-2026-10

fingerprint:
  radius: 2
  n_bits: 2048

binder:
  pkd_threshold: 7.0  # binder if pKd >= 7 (Kd <= 100 nM)

splits:
  scaffold_test_frac: 0.2
  cold_protein_test_frac: 0.2
  val_frac: 0.1
  # v1.1 loads existing IDs from paths.splits_dir; fractions above are documentation only

model:
  name: HistGradientBoostingRegressor
  max_iter: 200
  learning_rate: 0.08
  max_depth: 8
  min_samples_leaf: 20
  l2_regularization: 0.1
  early_stopping: true
  validation_fraction: 0.1
  n_iter_no_change: 15
  random_state: 42

protein_features:
  # modes exercised by scripts/run_protein_ablation.py: aac | dpc | aac_dpc | esm2
  type: aac
  esm2:
    model_name: esm2_t6_8M_UR50D
    cache_dir: data/cache/esm2_t6
    max_len: 1022

protein_ablation:
  modes: [aac, dpc, aac_dpc, esm2]

eval:
  ef_fractions: [0.01, 0.05]
  metric_float_tol: 1.0e-4

paths:
  raw_dir: data/raw
  splits_dir: data/splits
  models_dir: artifacts/models_v1.1
  metrics_md: artifacts/metrics_v1.1.md
  metrics_json: artifacts/metrics_v1.1.json
  demo_library: data/demo/library.csv
  sample_ranked: artifacts/sample_ranked.csv
