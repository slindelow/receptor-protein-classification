# Sofia VS v1.5 screening product - sofia-vs-v1.5-screen
# Prediction/ranking product (not more classification metrics).
seed: 42
freeze_id: sofia-vs-v1.5-screen
data_freeze_id: sofia-vs-v1-2026-10

fingerprint:
  radius: 2
  n_bits: 2048

binder:
  pkd_threshold: 7.0  # binder if pKd >= 7 (Kd <= 100 nM)

model:
  name: HistGradientBoostingRegressor
  max_iter: 200
  learning_rate: 0.08
  max_depth: 8
  min_samples_leaf: 20
  l2_regularization: 0.1
  early_stopping: true
  validation_fraction: 0.1
  n_iter_no_change: 15
  random_state: 42

protein_features:
  type: aac_dpc  # v1.1 cold-protein winner

screen:
  # Deployment weights: HistGBM ECFP+aac_dpc on scaffold train+val (held-out protocol already saved).
  train_protocol: scaffold_train_val
  # Demo target: well-known DAVIS kinase present in scaffold train (not cold).
  target_id: LCK
  library_n: 8000
  library_source: moleculenet_hiv
  library_url: https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/HIV.csv
  spike_in_davis_ligands: true  # include all 68 DAVIS ligands for recovery analysis
  top_export: null  # null = full ranking; always at least top 500
  ranked_min_rows: 500

paths:
  raw_dir: data/raw
  splits_dir: data/splits
  models_dir: artifacts/models_v1.5
  library_csv: data/screen_library/library_v1.5.csv
  library_manifest: data/screen_library/MANIFEST_screen.json
  metrics_md: artifacts/metrics_screen.md
  metrics_json: artifacts/metrics_screen.json
  ranked_csv: artifacts/screen_ranked.csv
