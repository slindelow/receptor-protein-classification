# Sofia VS v1.6 cold-target screen - sofia-vs-v1.6-cold-screen
# Honest version of the v1.5 LCK screen: the scored kinase is fully held out.
# Model scores, not wet-lab hits.
seed: 42
freeze_id: sofia-vs-v1.6-cold-screen
data_freeze_id: sofia-vs-v1-2026-10

fingerprint:
  radius: 2
  n_bits: 2048

binder:
  pkd_threshold: 7.0  # binder if pKd >= 7 (Kd <= 100 nM)

model:
  name: HistGradientBoostingRegressor
  max_iter: 200
  learning_rate: 0.08
  max_depth: 8
  min_samples_leaf: 20
  l2_regularization: 0.1
  early_stopping: true
  validation_fraction: 0.1
  n_iter_no_change: 15
  random_state: 42

protein_features:
  type: aac_dpc  # v1.1 cold-protein winner

screen:
  # Selection is checked by the script before training. Do not change after seeing scores.
  # Rule: exclude LCK; drop target_ids with '('; require >= 10 binders at pKd>=7;
  # pick the count closest to LCK (17). Result: SLK (17 binders).
  target_id: SLK
  exclude_target_id: LCK
  min_binders: 10
  train_protocol: cold_target_all_remaining_davis_pairs
  library_reuse: true

paths:
  raw_dir: data/raw
  models_dir: artifacts/models_v1.6
  library_csv: data/screen_library/library_v1.5.csv
  library_manifest: data/screen_library/MANIFEST_screen.json
  metrics_md: artifacts/metrics_screen_cold.md
  metrics_json: artifacts/metrics_screen_cold.json
  ranked_csv: artifacts/screen_ranked_cold.csv
