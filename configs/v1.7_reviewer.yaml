# Reviewer revision. Locked before the v1.7 fits.
# Does not retune the histogram booster or redraw data/splits/cold_protein_split.csv.
seed: 42
freeze_id: sofia-vs-v1.7-reviewer
data_freeze_id: sofia-vs-v1-2026-10
n_bootstrap: 1000
omp_num_threads: 4
min_kinases_for_interval: 8

fingerprint:
  radius: 2
  n_bits: 2048

binder:
  pkd_threshold: 7.0

splits:
  test_frac: 0.2
  val_frac: 0.1
  # Same greedy group assignment as src/vs/splits.py _assign_by_group.
  # Validation clusters are written and are not used for HistGBM early stopping.
  thresholds: [0.40, 0.50, 0.70]
  primary_threshold: 0.40

identity_bins:
  # Right-open bins, except the last bin, which includes 1.
  edges: [0.0, 0.30, 0.40, 0.50, 0.70, 1.0]
  # Max identity is measured against kinases in the fit (train), not against validation.
  # Validation clusters are held out of the fit and are not the early-stopping slice.
  reference_split: train

censoring:
  kd_cap_nm: 10000.0
  pkd_cap: 5.0
  # Kd is right-censored at 10000 nM. pKd is left-censored at 5.
  # Uncensored metrics are pooled Spearman, enrichment, and mean within-kinase Spearman.
  tobit_em_fits: 4
  tobit_splits: [cold_protein, seqid_c40]
  drop_censored_splits: [cold_protein, seqid_c40]
  early_stopping_off_splits: [seqid_c40]

mmseqs:
  release: "17-b804f"
  version_commit: "b804fbe384e6f6c9fe96322ec0e92d48bccd0a42"
  url: "https://github.com/soedinglab/MMseqs2/releases/download/17-b804f/mmseqs-linux-avx2.tar.gz"
  sha256: "6e195f5780ef97bba0882b5d5911413ba5c250f0d29c5b3ac1888d0d9f84f5d2"
  # CD-HIT-style greedy clustering by sequence length.
  cluster_mode: 2
  # Identity for the cluster threshold: identical residues / shorter sequence.
  seq_id_mode: 1
  coverage: 0.8
  # Coverage of query and of target.
  cov_mode: 0
  sensitivity: 7.5
  max_seqs_cluster: 500
  max_seqs_search: 400
  e_value: "inf"
  mask: 0
  single_step_clustering: 1
  alignment_mode: 3
  add_backtrace: 1
  threads: 4

additive:
  alpha_min_log10: -3
  alpha_max_log10: 6
  alpha_count: 19
  protein_type: aac_dpc

model:
  name: HistGradientBoostingRegressor
  max_iter: 200
  learning_rate: 0.08
  max_depth: 8
  min_samples_leaf: 20
  l2_regularization: 0.1
  early_stopping: true
  validation_fraction: 0.1
  n_iter_no_change: 15
  random_state: 42

eval:
  ef_fractions: [0.01, 0.05]
